<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion administrateur - Dr. Right</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Bibliothèque Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js" integrity="sha384-CLZeq1dk8+Uzrs7TVvBUdlFoV5F0DMqgRoeHa8g5wJcuPe5SkVfEvdxB0ZuzlnBQ" crossorigin="anonymous"></script>
    <script src="supabase-client.js"></script>
    <script src="utils.js"></script>
</head>


<body>

<div class="container">

    <h1>Dr. Right</h1>

    <h2>
        Connexion administrateur
    </h2>


    <form id="form-connexion-admin">

        <label for="email-admin">
            E-mail
        </label>

        <input
            id="email-admin"
            type="email"
            placeholder="Email administrateur"
            autocomplete="username"
            required
        >


        <label for="mot-de-passe-admin">
            Mot de passe
        </label>

        <input
            id="mot-de-passe-admin"
            type="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            Se connecter
        </button>

    </form>


    <p id="message-connexion" role="status"></p>

<a href="index.html">
    Retour à l'accueil
</a>

</div>

<script>

const formulaireAdmin =
    document.getElementById("form-connexion-admin");

const message =
    document.getElementById("message-connexion");


// ==========================================
// DEJA CONNECTE COMME ADMINISTRATEUR ?
// ==========================================

async function verifierConnexionExistante() {

    const { data: sessionData } =
        await supabaseClient.auth.getSession();

    if (!sessionData || !sessionData.session) {
        return;
    }

    const { data: administrateur } = await supabaseClient
        .from("administrateurs")
        .select("id")
        .eq("auth_user_id", sessionData.session.user.id)
        .eq("statut", "actif")
        .maybeSingle();

    if (administrateur) {
        window.location.replace("./administrateur.html");
    }

}


// ==========================================
// CONNEXION
// ==========================================

formulaireAdmin.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const deverrouiller =
            verrouillerFormulaire(formulaireAdmin);

        if (!deverrouiller) {
            return;
        }

        try {

            const email =
                document.getElementById("email-admin").value.trim();

            const motDePasse =
                document.getElementById("mot-de-passe-admin").value;

            if (!email || !motDePasse) {
                message.textContent =
                    "Veuillez remplir tous les champs.";
                return;
            }

            message.textContent = "Connexion en cours...";

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: motDePasse
                });

            if (error || !data || !data.user) {

                message.textContent =
                    "Email ou mot de passe incorrect.";

                return;
            }

            const {
                data: administrateur,
                error: erreurAdministrateur
            } = await supabaseClient
                .from("administrateurs")
                .select("id")
                .eq("auth_user_id", data.user.id)
                .eq("statut", "actif")
                .maybeSingle();

            if (erreurAdministrateur || !administrateur) {

                await supabaseClient.auth.signOut();

                message.textContent =
                    "Ce compte n'est pas autorisé comme administrateur actif.";

                return;
            }

            message.textContent =
                "Connexion réussie. Redirection...";

            window.location.replace("./administrateur.html");

        } finally {

            deverrouiller();

        }

    }
);


verifierConnexionExistante();

</script>

</body>
</html>
