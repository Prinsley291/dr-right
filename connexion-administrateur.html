<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion administrateur - Dr. Right</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Bibliothèque Supabase (version figée pour éviter qu'une mise à
         jour automatique du CDN introduise une régression silencieuse) -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
</head>


<body>

<div class="container">

    <h1>Dr. Right</h1>

    <h2>
        Connexion administrateur
    </h2>


    <form id="form-connexion-admin">

        <input
            id="email-admin"
            type="email"
            placeholder="Email administrateur"
            required
        >


        <input
            id="mot-de-passe-admin"
            type="password"
            placeholder="Mot de passe"
            required
        >


        <button type="submit">
            Se connecter
        </button>

    </form>


    <p id="message-connexion"></p>

<a href="index.html">
    Retour à l'accueil
</a>

</div>

<script>

const formulaireAdmin =
    document.getElementById("form-connexion-admin");

const boutonConnexionAdmin =
    formulaireAdmin.querySelector('button[type="submit"]');

formulaireAdmin.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        // Empêche un double envoi (double-clic / double-tap) qui
        // déclencherait deux appels signInWithPassword concurrents
        // sur le même client Supabase, un scénario connu pour bloquer
        // indéfiniment les librairies d'authentification.
        if (boutonConnexionAdmin.disabled) {
            return;
        }

        const email =
            document.getElementById("email-admin").value.trim();

        const motDePasse =
            document.getElementById("mot-de-passe-admin").value;

        const message =
            document.getElementById("message-connexion");

        boutonConnexionAdmin.disabled = true;
        message.textContent = "Connexion en cours...";

        let connexionReussie = false;

        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: motDePasse
                });

            if (error) {
                console.error(error);

                message.textContent =
                    "Email ou mot de passe incorrect.";

                return;
            }

            if (!data.user) {
                message.textContent =
                    "Impossible de connecter cet utilisateur.";

                return;
            }

            const {
                data: administrateur,
                error: erreurAdministrateur
            } = await supabaseClient
                .from("administrateurs")
                .select("*")
                .eq("auth_user_id", data.user.id)
                .eq("statut", "actif")
                .maybeSingle();

            if (erreurAdministrateur || !administrateur) {

                console.error(erreurAdministrateur);

                await supabaseClient.auth.signOut();

                message.textContent =
                    "Ce compte n'est pas autorisé comme administrateur actif.";

                return;
            }

            connexionReussie = true;

            message.textContent =
                "Connexion réussie. Redirection...";

            setTimeout(function () {

                window.location.href =
                    "./administrateur.html";

            }, 1000);

        } catch (erreurInattendue) {

            // Filet de sécurité : si signInWithPassword ou la requête
            // administrateurs lève une exception au lieu de renvoyer
            // proprement {data, error} (bug réseau, bug de librairie,
            // etc.), l'interface ne reste plus jamais figée sur
            // "Connexion en cours...".
            console.error("Erreur inattendue :", erreurInattendue);

            message.textContent =
                "Une erreur inattendue est survenue. Veuillez réessayer.";

        } finally {

            if (!connexionReussie) {
                boutonConnexionAdmin.disabled = false;
            }

        }
    }
);
</script>

</body>
</html>
