<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon compte - Dr. Right</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
</head>


<body>

<div class="container">

    <h1>Dr. Right</h1>

    <h2>Mon compte</h2>


    <!-- ======================================
         INFORMATIONS ETUDIANT
    ======================================= -->

    <div class="fiche-etudiant">

        <h3 id="bienvenue-etudiant">
            Chargement...
        </h3>

        <p>
            <strong>Nom :</strong>
            <span id="nom-etudiant">
                Chargement...
            </span>
        </p>

        <p>
            <strong>Compagnie :</strong>
            <span id="compagnie-etudiant">
                Chargement...
            </span>
        </p>

    </div>


    <!-- ======================================
         SITUATION FINANCIERE
    ======================================= -->

    <h3>Ma situation financière</h3>


    <div class="fiche-etudiant">

        <p>
            <strong>Solde Jus :</strong>
            <span id="solde-jus">
                Chargement...
            </span>
        </p>


        <p>
            <strong>Solde Manger :</strong>
            <span id="solde-manger">
                Chargement...
            </span>
        </p>


        <hr>


        <p>
            <strong>Solde total :</strong>
            <span id="solde-total">
                Chargement...
            </span>
        </p>


        <p id="message-credit"></p>

    </div>


    <!-- ======================================
         HISTORIQUE
    ======================================= -->

    <h3>Historique de mes opérations</h3>


    <div id="historique-etudiant">

        Chargement de l'historique...

    </div>


    <!-- ======================================
         DECONNEXION
    ======================================= -->

    <br>

    <button
        type="button"
        id="bouton-deconnexion"
    >
        Se déconnecter
    </button>


</div>


<!-- ======================================
     SUPABASE
======================================= -->



<script>

// ==========================================
// ELEMENTS
// ==========================================

const bienvenueEtudiant =
    document.getElementById(
        "bienvenue-etudiant"
    );


const nomEtudiant =
    document.getElementById(
        "nom-etudiant"
    );


const compagnieEtudiant =
    document.getElementById(
        "compagnie-etudiant"
    );


const soldeJus =
    document.getElementById(
        "solde-jus"
    );


const soldeManger =
    document.getElementById(
        "solde-manger"
    );


const soldeTotal =
    document.getElementById(
        "solde-total"
    );


const messageCredit =
    document.getElementById(
        "message-credit"
    );


const historiqueEtudiant =
    document.getElementById(
        "historique-etudiant"
    );


const boutonDeconnexion =
    document.getElementById(
        "bouton-deconnexion"
    );


// ==========================================
// ETUDIANT CONNECTE
// ==========================================

let etudiantConnecte = null;


// ==========================================
// FORMATTER UN SOLDE
// ==========================================

function afficherSolde(
    montant
) {

    const valeur =
        Number(montant) || 0;


    if (valeur > 0) {

        return `Dette : ${valeur} FCFA`;

    }


    if (valeur < 0) {

        return `Crédit : ${Math.abs(valeur)} FCFA`;

    }


    return "Solde : 0 FCFA";

}


// ==========================================
// CHARGER LE PROFIL
// ==========================================

async function chargerProfilEtudiant() {

    // --------------------------------------
    // RECUPERER UTILISATEUR AUTH
    // --------------------------------------

    const {
        data: userData,
        error: userError
    } = await supabaseClient
        .auth
        .getUser();


    if (
        userError ||
        !userData.user
    ) {

        window.location.href =
            "./connexion-etudiant.html";

        return;

    }


    const utilisateur =
        userData.user;


    // --------------------------------------
    // RECUPERER ETUDIANT
    // --------------------------------------

    const {
        data: etudiant,
        error: erreurEtudiant
    } = await supabaseClient

        .from("etudiants")

        .select(`
            id,
            nom,
            prenom,
            compagnie_id,
            dette_jus,
            dette_manger,
            statut,
            compagnies (
                nom
            )
        `)

        .eq(
            "auth_user_id",
            utilisateur.id
        )

        .eq(
            "statut",
            "actif"
        )

        .maybeSingle();


    if (
        erreurEtudiant ||
        !etudiant
    ) {

        console.error(
            erreurEtudiant
        );


        await supabaseClient
            .auth
            .signOut();


        window.location.href =
            "./connexion-etudiant.html";

        return;

    }


    etudiantConnecte =
        etudiant;


    // --------------------------------------
    // AFFICHER PROFIL
    // --------------------------------------

    bienvenueEtudiant.textContent =
        `Bienvenue ${etudiant.prenom} ${etudiant.nom}`;


    nomEtudiant.textContent =
        `${etudiant.prenom} ${etudiant.nom}`;


    // --------------------------------------
    // AFFICHER COMPAGNIE
    // --------------------------------------

    if (
        etudiant.compagnies &&
        etudiant.compagnies.nom
    ) {

        compagnieEtudiant.textContent =
            etudiant.compagnies.nom;

    } else {

        compagnieEtudiant.textContent =
            "Non renseignée";

    }


    // --------------------------------------
    // CALCUL DES SOLDES
    // --------------------------------------

    const detteJus =
        Number(
            etudiant.dette_jus
        ) || 0;


    const detteManger =
        Number(
            etudiant.dette_manger
        ) || 0;


    const total =
        detteJus +
        detteManger;


    // --------------------------------------
    // AFFICHAGE SOLDES
    // --------------------------------------

    soldeJus.textContent =
        afficherSolde(
            detteJus
        );


    soldeManger.textContent =
        afficherSolde(
            detteManger
        );


    soldeTotal.textContent =
        afficherSolde(
            total
        );


    // --------------------------------------
    // MESSAGE GENERAL
    // --------------------------------------

    if (total < 0) {

        messageCredit.textContent =
            `Vous avez un crédit disponible de ${Math.abs(total)} FCFA.`;

    }


    else if (total > 0) {

        messageCredit.textContent =
            `Il vous reste ${total} FCFA à régler au total.`;

    }


    else {

        messageCredit.textContent =
            "Votre compte est actuellement équilibré.";

    }


    // --------------------------------------
    // CHARGER HISTORIQUE
    // --------------------------------------

    await chargerHistorique();

}


// ==========================================
// CHARGER HISTORIQUE OPERATIONS
// ==========================================

async function chargerHistorique() {

    if (!etudiantConnecte) {

        return;

    }


    historiqueEtudiant.innerHTML =
        "Chargement de l'historique...";


    // --------------------------------------
    // OPERATIONS / ACHATS / DETTES
    // --------------------------------------

    const {
        data: operations,
        error: erreurOperations
    } = await supabaseClient

        .from("operations")

        .select(`
            id,
            created_at,
            type_operation,
            categorie,
            quantite,
            montant,
            note,
            produits (
                nom
            )
        `)

        .eq(
            "etudiant_id",
            etudiantConnecte.id
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    // --------------------------------------
    // PAIEMENTS
    // --------------------------------------

    const {
        data: paiements,
        error: erreurPaiements
    } = await supabaseClient

        .from("paiements")

        .select(`
            id,
            created_at,
            categorie,
            montant,
            moyen_paiement
        `)

        .eq(
            "etudiant_id",
            etudiantConnecte.id
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (
        erreurOperations ||
        erreurPaiements
    ) {

        console.error(
            erreurOperations
        );


        console.error(
            erreurPaiements
        );


        historiqueEtudiant.innerHTML =
            "<p>Impossible de charger l'historique.</p>";

        return;

    }


    // --------------------------------------
    // REGROUPER LES ELEMENTS
    // --------------------------------------

    const historique =
        [];


    // OPERATIONS

    (operations || []).forEach(
        function (operation) {

            historique.push({

                type:
                    "operation",

                date:
                    operation.created_at,

                categorie:
                    operation.categorie,

                montant:
                    Number(
                        operation.montant
                    ) || 0,

                quantite:
                    operation.quantite,

                note:
                    operation.note,

                produit:
                    operation.produits
                        ? operation.produits.nom
                        : null

            });

        }
    );


    // PAIEMENTS

    (paiements || []).forEach(
        function (paiement) {

            historique.push({

                type:
                    "paiement",

                date:
                    paiement.created_at,

                categorie:
                    paiement.categorie,

                montant:
                    Number(
                        paiement.montant
                    ) || 0,

                moyen:
                    paiement.moyen_paiement

            });

        }
    );


    // --------------------------------------
    // TRIER PAR DATE
    // --------------------------------------

    historique.sort(
        function (a, b) {

            return (
                new Date(b.date) -
                new Date(a.date)
            );

        }
    );


    // --------------------------------------
    // AUCUN HISTORIQUE
    // --------------------------------------

    if (
        historique.length === 0
    ) {

        historiqueEtudiant.innerHTML =
            "<p>Aucune opération enregistrée pour le moment.</p>";

        return;

    }


    // --------------------------------------
    // AFFICHER HISTORIQUE
    // --------------------------------------

    historiqueEtudiant.innerHTML =
        "";


    historique.forEach(
        function (element) {

            const carte =
                document.createElement(
                    "div"
                );


            carte.className =
                "carte-operation";


            const date =
                new Date(
                    element.date
                ).toLocaleString(
                    "fr-FR"
                );


            // ==================================
            // PAIEMENT
            // ==================================

            if (
                element.type ===
                "paiement"
            ) {

                carte.innerHTML = `

                    <h4>
                        PAIEMENT — ${element.categorie.toUpperCase()}
                    </h4>

                    <p>
                        <strong>Montant payé :</strong>
                        ${element.montant} FCFA
                    </p>

                    <p>
                        <strong>Moyen :</strong>
                        ${element.moyen}
                    </p>

                    <p>
                        <strong>Date :</strong>
                        ${date}
                    </p>

                `;

            }


            // ==================================
            // ACHAT / DETTE
            // ==================================

            else {

                let contenu =
                    `
                    <h4>
                        ${element.categorie.toUpperCase()}
                    </h4>
                `;


                if (element.produit) {

                    contenu += `

                        <p>
                            <strong>Produit :</strong>
                            ${element.produit}
                        </p>

                    `;


                    if (
                        element.quantite
                    ) {

                        contenu += `

                            <p>
                                <strong>Quantité :</strong>
                                ${element.quantite}
                            </p>

                        `;

                    }

                }


                else {

                    contenu += `

                        <p>
                            <strong>Dette ajoutée :</strong>
                            ${element.montant} FCFA
                        </p>

                    `;

                }


                contenu += `

                    <p>
                        <strong>Montant :</strong>
                        ${element.montant} FCFA
                    </p>

                `;


                if (element.note) {

                    contenu += `

                        <p>
                            <strong>Note :</strong>
                            ${element.note}
                        </p>

                    `;

                }


                contenu += `

                    <p>
                        <strong>Date :</strong>
                        ${date}
                    </p>

                `;


                carte.innerHTML =
                    contenu;

            }


            historiqueEtudiant.appendChild(
                carte
            );

        }
    );

}


// ==========================================
// DECONNEXION
// ==========================================

boutonDeconnexion.addEventListener(
    "click",
    async function () {

        boutonDeconnexion.disabled =
            true;


        boutonDeconnexion.textContent =
            "Déconnexion...";


        await supabaseClient
            .auth
            .signOut();


        window.location.href =
            "./index.html";

    }
);


// ==========================================
// DEMARRAGE
// ==========================================

chargerProfilEtudiant();


</script>


</body>

</html>
