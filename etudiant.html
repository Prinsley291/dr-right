<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon compte - Dr. Right</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .colonnes-historique {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .colonnes-historique.colonne-unique {
            grid-template-columns: 1fr;
        }

        .colonne-historique h4 {
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {

            .colonnes-historique {
                grid-template-columns: 1fr;
            }

        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
</head>


<body>

<div class="container">

    <h1>Dr. Right</h1>

    <h2>Mon compte</h2>


    <!-- ======================================
         INFORMATIONS ETUDIANT
    ======================================= -->

    <div class="fiche-etudiant">

        <h3 id="bienvenue-etudiant">
            Chargement...
        </h3>

        <p>
            <strong>Nom :</strong>
            <span id="nom-etudiant">
                Chargement...
            </span>
        </p>

        <p>
            <strong>Compagnie :</strong>
            <span id="compagnie-etudiant">
                Chargement...
            </span>
        </p>

    </div>


    <!-- ======================================
         SITUATION FINANCIERE
    ======================================= -->

    <h3>Ma situation financière</h3>


    <div class="fiche-etudiant">

        <p>
            <strong>Solde Jus :</strong>
            <span id="solde-jus">
                Chargement...
            </span>
        </p>


        <p>
            <strong>Solde Manger :</strong>
            <span id="solde-manger">
                Chargement...
            </span>
        </p>


        <hr>


        <p>
            <strong>Solde total :</strong>
            <span id="solde-total">
                Chargement...
            </span>
        </p>


        <p id="message-credit"></p>

    </div>


    <!-- ======================================
         HISTORIQUE
    ======================================= -->

    <h3>Historique de mes opérations</h3>


    <div id="historique-etudiant">

        Chargement de l'historique...

    </div>


    <!-- ======================================
         DECONNEXION
    ======================================= -->

    <br>

    <button
        type="button"
        id="bouton-deconnexion"
    >
        Se déconnecter
    </button>


</div>


<!-- ======================================
     SUPABASE
======================================= -->



<script>

// ==========================================
// ELEMENTS
// ==========================================

const bienvenueEtudiant =
    document.getElementById(
        "bienvenue-etudiant"
    );


const nomEtudiant =
    document.getElementById(
        "nom-etudiant"
    );


const compagnieEtudiant =
    document.getElementById(
        "compagnie-etudiant"
    );


const soldeJus =
    document.getElementById(
        "solde-jus"
    );


const soldeManger =
    document.getElementById(
        "solde-manger"
    );


const soldeTotal =
    document.getElementById(
        "solde-total"
    );


const messageCredit =
    document.getElementById(
        "message-credit"
    );


const historiqueEtudiant =
    document.getElementById(
        "historique-etudiant"
    );


const boutonDeconnexion =
    document.getElementById(
        "bouton-deconnexion"
    );


// ==========================================
// ETUDIANT CONNECTE
// ==========================================

let etudiantConnecte = null;


// ==========================================
// FORMATTER UN SOLDE
// ==========================================

function afficherSolde(
    montant
) {

    const valeur =
        Number(montant) || 0;


    if (valeur > 0) {

        return `Dette : ${valeur} FCFA`;

    }


    if (valeur < 0) {

        return `Crédit : ${Math.abs(valeur)} FCFA`;

    }


    return "Solde : 0 FCFA";

}


// ==========================================
// CHARGER LE PROFIL
// ==========================================

async function chargerProfilEtudiant() {

    try {

        // --------------------------------------
        // RECUPERER UTILISATEUR AUTH
        // --------------------------------------

        const {
            data: userData,
            error: userError
        } = await supabaseClient
            .auth
            .getUser();


        if (
            userError ||
            !userData.user
        ) {

            window.location.href =
                "./connexion-etudiant.html";

            return;

        }


        const utilisateur =
            userData.user;


        // --------------------------------------
        // RECUPERER ETUDIANT
        // --------------------------------------

        const {
            data: etudiant,
            error: erreurEtudiant
        } = await supabaseClient

            .from("etudiants")

            .select(`
                id,
                nom,
                prenom,
                compagnie_id,
                dette_jus,
                dette_manger,
                statut,
                compagnies (
                    nom
                )
            `)

            .eq(
                "auth_user_id",
                utilisateur.id
            )

            .eq(
                "statut",
                "actif"
            )

            .maybeSingle();


        if (
            erreurEtudiant ||
            !etudiant
        ) {

            console.error(
                erreurEtudiant
            );


            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "./connexion-etudiant.html";

            return;

        }


        etudiantConnecte =
            etudiant;


        // --------------------------------------
        // AFFICHER PROFIL
        // --------------------------------------

        bienvenueEtudiant.textContent =
            `Bienvenue ${etudiant.prenom} ${etudiant.nom}`;


        nomEtudiant.textContent =
            `${etudiant.prenom} ${etudiant.nom}`;


        // --------------------------------------
        // AFFICHER COMPAGNIE
        // --------------------------------------

        if (
            etudiant.compagnies &&
            etudiant.compagnies.nom
        ) {

            compagnieEtudiant.textContent =
                etudiant.compagnies.nom;

        } else {

            compagnieEtudiant.textContent =
                "Non renseignée";

        }


        // --------------------------------------
        // CALCUL DES SOLDES
        // --------------------------------------

        const detteJus =
            Number(
                etudiant.dette_jus
            ) || 0;


        const detteManger =
            Number(
                etudiant.dette_manger
            ) || 0;


        const total =
            detteJus +
            detteManger;


        // --------------------------------------
        // AFFICHAGE SOLDES
        // --------------------------------------

        soldeJus.textContent =
            afficherSolde(
                detteJus
            );


        soldeManger.textContent =
            afficherSolde(
                detteManger
            );


        soldeTotal.textContent =
            afficherSolde(
                total
            );


        // --------------------------------------
        // MESSAGE GENERAL
        // --------------------------------------

        if (total < 0) {

            messageCredit.textContent =
                `Vous avez un crédit disponible de ${Math.abs(total)} FCFA.`;

        }


        else if (total > 0) {

            messageCredit.textContent =
                `Il vous reste ${total} FCFA à régler au total.`;

        }


        else {

            messageCredit.textContent =
                "Votre compte est actuellement équilibré.";

        }


        // --------------------------------------
        // CHARGER HISTORIQUE
        // --------------------------------------

        await chargerHistorique();

    } catch (erreurInattendue) {

        // Filet de sécurité : plus jamais bloqué sur "Chargement..."
        // si une exception inattendue survient.
        console.error(
            "Erreur inattendue lors du chargement du profil :",
            erreurInattendue
        );

        bienvenueEtudiant.textContent =
            "Une erreur inattendue est survenue.";

        nomEtudiant.textContent =
            "—";

        compagnieEtudiant.textContent =
            "—";

    }

}


// ==========================================
// CHARGER HISTORIQUE OPERATIONS
// ==========================================

function construireCarteElement(element) {

    const date =
        new Date(element.date).toLocaleString(
            "fr-FR",
            {
                day: "numeric",
                month: "short",
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    // ==================================
    // PAIEMENT
    // ==================================

    if (element.type === "paiement") {

        return `

            <div class="ligne-historique">

                <div>
                    <p class="ligne-historique-titre">
                        Paiement
                    </p>
                    <p class="ligne-historique-meta">
                        ${element.moyen}, ${date}
                    </p>
                </div>

                <div class="ligne-historique-montant paiement">
                    − ${element.montant} FCFA
                </div>

            </div>

        `;

    }


    // ==================================
    // OPERATION (achat / dette),
    // potentiellement plusieurs produits
    // regroupés sur la même carte.
    // ==================================

    const detailItems =
        element.items.map(
            function (item) {

                if (item.nom) {

                    return item.quantite
                        ? `${item.nom} × ${item.quantite}`
                        : item.nom;

                }

                return item.note
                    ? `Dette ajoutée (${item.note})`
                    : "Dette ajoutée";

            }
        ).join(", ");


    return `

        <div class="ligne-historique">

            <div>
                <p class="ligne-historique-titre">
                    ${detailItems}
                </p>
                <p class="ligne-historique-meta">
                    ${date}
                </p>
            </div>

            <div class="ligne-historique-montant">
                + ${element.montant} FCFA
            </div>

        </div>

    `;

}


function construireElementsHistorique(
    operations,
    paiements
) {

    // Les opérations issues d'une même soumission de panier
    // (même lot_id) ET de la même catégorie sont regroupées
    // sur une seule carte. Les anciennes opérations sans
    // lot_id (avant cette mise à jour) restent chacune sur
    // leur propre carte.

    const groupesParCle =
        new Map();


    (operations || []).forEach(
        function (operation) {

            const cle =
                (operation.lot_id || ("op-" + operation.id)) +
                "|" +
                operation.categorie;


            if (!groupesParCle.has(cle)) {

                groupesParCle.set(cle, {

                    type:
                        "operation",

                    categorie:
                        operation.categorie,

                    date:
                        operation.created_at,

                    montant:
                        0,

                    items:
                        []

                });

            }


            const groupe =
                groupesParCle.get(cle);


            const montant =
                Number(
                    operation.montant
                ) || 0;


            groupe.montant +=
                montant;


            if (
                new Date(operation.created_at) <
                new Date(groupe.date)
            ) {

                groupe.date =
                    operation.created_at;

            }


            groupe.items.push({

                nom:
                    operation.produits
                        ? operation.produits.nom
                        : null,

                quantite:
                    operation.quantite,

                note:
                    operation.note

            });

        }
    );


    const elementsOperations =
        Array.from(
            groupesParCle.values()
        );


    // Les paiements restent des éléments individuels

    const elementsPaiements =
        (paiements || []).map(
            function (paiement) {

                return {

                    type:
                        "paiement",

                    categorie:
                        paiement.categorie,

                    date:
                        paiement.created_at,

                    montant:
                        Number(
                            paiement.montant
                        ) || 0,

                    moyen:
                        paiement.moyen_paiement,

                    items:
                        []

                };

            }
        );


    const tousLesElements =
        elementsOperations.concat(
            elementsPaiements
        );


    tousLesElements.sort(
        function (a, b) {

            return (
                new Date(b.date) -
                new Date(a.date)
            );

        }
    );


    return {

        manger:
            tousLesElements.filter(
                function (element) {

                    return (
                        element.categorie ===
                        "manger"
                    );

                }
            ),

        jus:
            tousLesElements.filter(
                function (element) {

                    return (
                        element.categorie ===
                        "jus"
                    );

                }
            )

    };

}


function afficherColonnesHistorique(
    container,
    elements
) {

    const aManger =
        elements.manger.length > 0;


    const aJus =
        elements.jus.length > 0;


    const classeColonnes =
        (!aManger || !aJus)
            ? "colonnes-historique colonne-unique"
            : "colonnes-historique";


    let html =
        `<div class="${classeColonnes}">`;


    if (aManger) {

        html += `

            <div class="colonne-historique">

                <h4>🍽️ Manger</h4>

                ${elements.manger.map(
                    construireCarteElement
                ).join("")}

            </div>

        `;

    }


    if (aJus) {

        html += `

            <div class="colonne-historique">

                <h4>🧃 Jus</h4>

                ${elements.jus.map(
                    construireCarteElement
                ).join("")}

            </div>

        `;

    }


    html += `</div>`;


    container.innerHTML =
        html;

}


// ==========================================
// CHARGER HISTORIQUE OPERATIONS
// ==========================================

async function chargerHistorique() {

    if (!etudiantConnecte) {

        return;

    }


    historiqueEtudiant.innerHTML =
        "Chargement de l'historique...";


    try {

        // --------------------------------------
        // OPERATIONS / ACHATS / DETTES
        // --------------------------------------

        const {
            data: operations,
            error: erreurOperations
        } = await supabaseClient

            .from("operations")

            .select(`
                id,
                created_at,
                type_operation,
                categorie,
                quantite,
                montant,
                note,
                lot_id,
                produits (
                    nom
                )
            `)

            .eq(
                "etudiant_id",
                etudiantConnecte.id
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        // --------------------------------------
        // PAIEMENTS
        // --------------------------------------

        const {
            data: paiements,
            error: erreurPaiements
        } = await supabaseClient

            .from("paiements")

            .select(`
                id,
                created_at,
                categorie,
                montant,
                moyen_paiement
            `)

            .eq(
                "etudiant_id",
                etudiantConnecte.id
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (
            erreurOperations ||
            erreurPaiements
        ) {

            console.error(
                erreurOperations
            );


            console.error(
                erreurPaiements
            );


            historiqueEtudiant.innerHTML =
                "<p>Impossible de charger l'historique.</p>";

            return;

        }


        // --------------------------------------
        // REGROUPER PAR LOT + CATEGORIE
        // --------------------------------------

        const elements =
            construireElementsHistorique(
                operations,
                paiements
            );


        // --------------------------------------
        // AUCUN HISTORIQUE
        // --------------------------------------

        if (
            elements.manger.length === 0 &&
            elements.jus.length === 0
        ) {

            historiqueEtudiant.innerHTML =
                "<p>Aucune opération enregistrée pour le moment.</p>";

            return;

        }


        // --------------------------------------
        // AFFICHER EN DEUX COLONNES
        // --------------------------------------

        afficherColonnesHistorique(
            historiqueEtudiant,
            elements
        );

    } catch (erreurInattendue) {

        console.error(
            "Erreur inattendue lors du chargement de l'historique :",
            erreurInattendue
        );

        historiqueEtudiant.innerHTML =
            "<p>Une erreur inattendue est survenue lors du chargement de l'historique.</p>";

    }

}


// ==========================================
// DECONNEXION
// ==========================================

boutonDeconnexion.addEventListener(
    "click",
    async function () {

        boutonDeconnexion.disabled =
            true;


        boutonDeconnexion.textContent =
            "Déconnexion...";


        try {

            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "./index.html";

        } catch (erreurInattendue) {

            console.error(
                "Erreur inattendue de déconnexion :",
                erreurInattendue
            );

            boutonDeconnexion.disabled =
                false;

            boutonDeconnexion.textContent =
                "Se déconnecter";

        }

    }
);


// ==========================================
// DEMARRAGE
// ==========================================

chargerProfilEtudiant();


</script>


</body>

</html>
